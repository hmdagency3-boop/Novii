[build]
  command = "pnpm install && BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/novii-admin run build"
  publish = "artifacts/novii-admin/dist/public"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# SPA fallback — all routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
